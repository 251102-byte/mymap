<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CINE MAP | 전국 특별관 지도</title><style>
:root{--bg:#19151b;--panel:#231b24;--card:#302431;--wine:#882d50;--pink:#e9a5be;--muted:#c7b3be;--border:#503948}*{box-sizing:border-box}body{margin:0;font-family:Arial,'Apple SD Gothic Neo',sans-serif;background:var(--bg);color:#fff}button,input{font:inherit}button{cursor:pointer}.app{display:flex;height:100dvh}.sidebar{width:385px;min-width:300px;max-width:46%;background:var(--panel);display:flex;flex-direction:column;z-index:2}.brand{text-align:center;background:var(--bg);padding:22px 10px 17px}.brand h1{color:var(--pink);margin:0;font-size:28px}.brand p{color:var(--muted);font-size:12px;margin:6px 0 0}.tabs{display:grid;grid-template-columns:repeat(4,1fr)}.tab{background:#2b2230;border:0;border-bottom:3px solid transparent;color:#d8c4cf;padding:15px 2px;font-size:12px;font-weight:bold}.tab.active{background:#432635;border-bottom-color:var(--pink);color:white}.controls{padding:14px;border-bottom:1px solid var(--border)}.search{display:flex;gap:6px}.search input{width:100%;min-width:0;background:#1a141c;border:1px solid #765167;border-radius:8px;padding:11px;color:white}.search button,.locate{background:var(--wine);border:0;border-radius:8px;color:white;font-weight:bold;padding:10px 14px}.subcontrols{margin-top:10px;display:flex;align-items:center;justify-content:space-between}.all{background:transparent;color:var(--pink);border:1px solid #a65a78;border-radius:20px;padding:7px 10px;font-size:12px}.all.active{background:var(--wine);color:white}.count,.status,.note{color:var(--muted);font-size:12px}.status{padding:10px 15px;margin:0;line-height:1.6}.results{overflow-y:auto;padding:0 12px 20px;flex:1}.result{display:block;width:100%;text-align:left;background:var(--card);color:white;border:1px solid var(--border);border-radius:11px;margin:8px 0;padding:13px;cursor:pointer}.result:hover,.result:focus-visible{outline:2px solid var(--pink)}.result:disabled{opacity:.55;cursor:not-allowed}.result strong{display:block;margin-bottom:6px}.result small{display:block;color:var(--muted);margin-top:6px;line-height:1.4}.tag{display:inline-block;padding:4px 6px;border-radius:4px;color:white;font-size:10px;margin:2px 4px 2px 0;background:#555}.tag.imax{background:#286da8}.tag.four{background:#af4c69}.tag.screenx{background:#7656b0}.tag.dolby{background:#18827f}.map-area{position:relative;min-width:0;flex:1}#map{width:100%;height:100%;background:#dbe6e6}.locate{position:absolute;top:15px;right:15px;z-index:3;box-shadow:0 2px 10px #0004}.legend{position:absolute;right:15px;bottom:15px;background:#fffcf9ed;color:#222;border-radius:9px;padding:10px;z-index:3;font-size:11px;line-height:2;box-shadow:0 2px 10px #0003}.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.popup{background:#251821;color:white;padding:14px;border:1px solid #c17b99;border-radius:12px;min-width:220px;max-width:270px;box-shadow:0 4px 15px #0007;position:relative}.popup:after{content:"";position:absolute;bottom:-9px;left:calc(50% - 9px);border-style:solid;border-width:9px 9px 0;border-color:#251821 transparent transparent}.popup strong{display:block;padding-right:25px;margin-bottom:7px;font-size:14px}.popup p{font-size:12px;color:#f0d4e0}.popup a{font-size:12px;color:#ffb4d2}.pop-close{position:absolute;top:4px;right:8px;border:0;background:none;color:white;font-size:22px}.note{padding:8px 13px;border-top:1px solid var(--border)}@media(max-width:700px){.app{flex-direction:column}.sidebar{width:100%;max-width:none;min-width:0;height:49%;min-height:285px}.brand{padding:10px}.brand h1{font-size:23px}.tab{padding:10px 2px}.map-area{height:51%;min-height:200px}.legend{display:none}}
</style></head><body><div class="app"><aside class="sidebar"><header class="brand"><h1>🎬 CINE MAP</h1><p>전국 IMAX · 4DX · SCREENX · Dolby Cinema</p></header><nav class="tabs" aria-label="특별관"><button class="tab" data-type="IMAX">IMAX</button><button class="tab" data-type="4DX">4DX</button><button class="tab" data-type="SCREENX">SCREENX</button><button class="tab" data-type="DOLBY">DOLBY</button></nav><div class="controls"><form class="search" id="searchForm"><input id="keyword" placeholder="지역 또는 영화관 검색 (예: 대구)" aria-label="검색어"><button>검색</button></form><div class="subcontrols"><button class="all active" id="allBtn" type="button">전체 특별관 보기</button><span class="count" id="count"></span></div></div><p id="status" class="status" role="status">지도 로딩 중...</p><section id="results" class="results"></section><div class="note">극장·상영 정보는 변동될 수 있어요. 예매 전 공식 사이트를 확인하세요.</div></aside><main class="map-area"><div id="map" aria-label="카카오맵"></div><button class="locate" id="myLocation" type="button">◎ 내 위치</button><div class="legend"><div><i style="background:#286da8"></i>IMAX</div><div><i style="background:#af4c69"></i>4DX</div><div><i style="background:#7656b0"></i>SCREENX</div><div><i style="background:#18827f"></i>Dolby Cinema</div></div></main></div><script>
// 카카오 개발자 사이트에서 발급받은 JavaScript 키
const KAKAO_KEY='8929e02f1021d579204392c70668597d';
const fallbackCinemas = [];
// Google 시트: 파일 > 공유 > 웹에 게시 > CSV 링크를 아래 따옴표 안에 입력
// 예시: https://docs.google.com/spreadsheets/d/e/2PACX-.../pub?output=csv
const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/1sxdD4DoQ5lbhVmfBmI3WrFSQWn7hu04zH8Sj3_n9mu4/edit?usp=sharing';
let cinemas = fallbackCinemas.map(c => ({...c, types:[...c.types]}));

// 따옴표로 감싼 주소나 쉼표를 지원하는 CSV 파서
function parseCSV(text){
  const rows=[];let row=[],cell='',quoted=false;
  text=text.replace(/^\uFEFF/,'');
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(ch==='"'){
      if(quoted&&text[i+1]==='"'){cell+='"';i++;}else quoted=!quoted;
    }else if(ch===','&&!quoted){row.push(cell);cell='';}
    else if((ch==='\n'||ch==='\r')&&!quoted){
      if(ch==='\r'&&text[i+1]==='\n')i++;
      row.push(cell);if(row.some(v=>v.trim()))rows.push(row);row=[];cell='';
    }else cell+=ch;
  }
  row.push(cell);if(row.some(v=>v.trim()))rows.push(row);
  return rows;
}
async function loadCinemaData(){
  if(!SHEET_CSV_URL.startsWith('https://')){
    return '시트 주소 미설정: 내장 예시 '+cinemas.length+'개를 표시합니다.';
  }
  const response=await fetch(SHEET_CSV_URL,{cache:'no-store'});
  if(!response.ok)throw new Error('CSV 요청 실패 (HTTP '+response.status+')');
  const table=parseCSV(await response.text());
  if(table.length<2)throw new Error('시트에 데이터 행이 없습니다.');
  const cols=table[0].map(x=>x.trim().toLowerCase());
  for(const need of ['name','address','types'])if(!cols.includes(need))throw new Error('시트에 '+need+' 열이 없습니다.');
  const idx=k=>cols.indexOf(k);
  const validTypes=['IMAX','4DX','SCREENX','DOLBY'];
  const loaded=table.slice(1).map(r=>({
    name:(r[idx('name')]||'').trim(),
    address:(r[idx('address')]||'').trim(),
    types:(r[idx('types')]||'').toUpperCase().split(/[,，\/;|]/).map(t=>t.trim()).filter(t=>validTypes.includes(t))
  })).filter(c=>c.name&&c.address&&c.types.length);
  if(!loaded.length)throw new Error('유효한 영화관 데이터가 없습니다.');
  cinemas=loaded;
  return 'Google 시트에서 '+loaded.length+'개 영화관을 불러왔어요.';
}
const colors={IMAX:'#286da8','4DX':'#af4c69',SCREENX:'#7656b0',DOLBY:'#18827f'};
let map,geocoder,places,locationMarker,popup,selectedType='ALL',keyword='',myPosition=null;
let movieMarkers=[];
const statusEl=document.getElementById('status');
const setStatus=message=>statusEl.textContent=message;
function escapeHtml(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function closePopup(){if(popup){popup.setMap(null);popup=null;}}
function makeIcon(type){
  // 특별관 유형별 색상을 적용한 영화 필름 모양 SVG 마커
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="46" height="56" viewBox="0 0 46 56"><path d="M23 2C11 2 3 11 3 23c0 16 20 30 20 30s20-14 20-30C43 11 35 2 23 2Z" fill="${colors[type]}" stroke="white" stroke-width="3"/><rect x="12" y="15" width="22" height="16" rx="3" fill="white"/><path d="M16 15v16M23 15v16M30 15v16" stroke="${colors[type]}" stroke-width="3"/></svg>`;
  return new kakao.maps.MarkerImage('data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg),new kakao.maps.Size(46,56),{offset:new kakao.maps.Point(23,53)});
}
function showDetails(cinema){
  closePopup();
  const tags=cinema.types.map(type=>`<span class="tag ${type==='IMAX'?'imax':type==='4DX'?'four':type==='SCREENX'?'screenx':'dolby'}">${type==='DOLBY'?'Dolby Cinema':type}</span>`).join('');
  const link='https://map.kakao.com/link/search/'+encodeURIComponent(cinema.name);
  const html=`<div class="popup"><button class="pop-close" type="button" onclick="closePopup()" aria-label="닫기">×</button><strong>🎟 ${escapeHtml(cinema.name)}</strong><div>${tags}</div><p>📍 ${escapeHtml(cinema.address)}</p><a href="${link}" target="_blank" rel="noopener noreferrer">카카오맵 상세 정보 ↗</a></div>`;
  popup=new kakao.maps.CustomOverlay({map,position:cinema.position,content:html,yAnchor:1.15,zIndex:5});
  map.panTo(cinema.position);
}
function filteredCinemas(){return cinemas.filter(cinema=>(selectedType==='ALL'||cinema.types.includes(selectedType))&&(cinema.name+' '+cinema.address).toLowerCase().includes(keyword));}
function drawResults(){
  closePopup();movieMarkers.forEach(marker=>marker.setMap(null));movieMarkers=[];
  const results=filteredCinemas(),list=document.getElementById('results');list.replaceChildren();
  document.getElementById('count').textContent=results.length+'개 영화관';
  document.querySelectorAll('.tab').forEach(button=>button.classList.toggle('active',button.dataset.type===selectedType));
  document.getElementById('allBtn').classList.toggle('active',selectedType==='ALL');
  if(!results.length){const p=document.createElement('p');p.className='status';p.textContent='일치하는 영화관이 없어요. 다른 지역이나 특별관을 검색해 보세요.';list.append(p);return;}
  const bounds=new kakao.maps.LatLngBounds();let placed=0;
  results.forEach(cinema=>{
    const card=document.createElement('button');card.className='result';card.type='button';
    const tags=cinema.types.map(type=>`<span class="tag ${type==='IMAX'?'imax':type==='4DX'?'four':type==='SCREENX'?'screenx':'dolby'}">${type==='DOLBY'?'Dolby Cinema':type}</span>`).join('');
    card.innerHTML=`<strong>🎞 ${escapeHtml(cinema.name)}</strong>${tags}<small>${escapeHtml(cinema.address)}</small>`;
    list.append(card);
    if(!cinema.position){card.disabled=true;card.title='위치를 확인하지 못했어요';return;}
    placed++;bounds.extend(cinema.position);
    const type=selectedType==='ALL'?cinema.types[0]:selectedType;
    const marker=new kakao.maps.Marker({map,position:cinema.position,image:makeIcon(type),title:cinema.name});
    movieMarkers.push(marker);
    card.addEventListener('click',()=>showDetails(cinema));
    kakao.maps.event.addListener(marker,'click',()=>showDetails(cinema));
  });
  if(placed){map.setBounds(bounds,65,65,65,65);if(placed===1)map.setLevel(5);}
  if(placed<results.length)setStatus('일부 영화관의 좌표를 찾지 못했어요. 지점명을 확인해 주세요.');
}
function requestLocation(move=true){
  if(!navigator.geolocation||!window.isSecureContext){setStatus('현재 위치는 HTTPS 또는 localhost에서 사용할 수 있어요.');return;}
  setStatus('현재 위치를 확인하는 중이에요.');
  navigator.geolocation.getCurrentPosition(position=>{
    myPosition=new kakao.maps.LatLng(position.coords.latitude,position.coords.longitude);
    if(locationMarker)locationMarker.setMap(null);
    const dot=document.createElement('div');dot.title='내 위치';dot.style.cssText='width:19px;height:19px;background:#278cfa;border:4px solid white;border-radius:50%;box-shadow:0 2px 10px #284966';
    locationMarker=new kakao.maps.CustomOverlay({map,position:myPosition,content:dot,yAnchor:.5});
    if(move){map.setCenter(myPosition);map.setLevel(5);}setStatus('현재 위치를 표시했어요. 원하는 특별관을 선택해 보세요.');
  },error=>setStatus(error.code===1?'위치 권한이 거부되어 있어요. 지도는 계속 사용할 수 있어요.':'위치를 확인할 수 없어요. 지도는 계속 사용할 수 있어요.'),{enableHighAccuracy:true,timeout:10000,maximumAge:60000});
}
function lookupCinema(cinema){return new Promise(resolve=>{
  // 주소로 우선 검색하고, 실패하면 장소명으로 한 번 더 검색
  geocoder.addressSearch(cinema.address,(data,status)=>{
    if(status===kakao.maps.services.Status.OK&&data.length){cinema.position=new kakao.maps.LatLng(Number(data[0].y),Number(data[0].x));resolve();return;}
    places.keywordSearch(cinema.name,(matches,searchStatus)=>{
      if(searchStatus===kakao.maps.services.Status.OK&&matches.length){
        // 같은 브랜드의 다른 지역 지점을 잘못 찍지 않도록 이름을 비교
        const normalize=value=>value.replace(/\s/g,'').toLowerCase();
        const target=normalize(cinema.name);
        const chosen=matches.find(place=>normalize(place.place_name)===target)
          ||matches.find(place=>normalize(place.place_name).includes(target));
        if(chosen)cinema.position=new kakao.maps.LatLng(Number(chosen.y),Number(chosen.x));
      }
      resolve();
    });
  });
});}
async function initializeMap(){
  try{
    map=new kakao.maps.Map(document.getElementById('map'),{center:new kakao.maps.LatLng(36.4,127.8),level:13});
    geocoder=new kakao.maps.services.Geocoder();places=new kakao.maps.services.Places();
    setStatus('영화관 데이터를 불러오는 중이에요...');
    let dataMessage;
    try{dataMessage=await loadCinemaData();}
    catch(error){
      console.error('Google 시트 CSV 오류:',error);
      dataMessage='시트 연결 오류: '+error.message+' / 내장 목록 '+cinemas.length+'개로 표시합니다.';
    }
    setStatus(dataMessage+' 영화관 좌표를 찾는 중...');
    await Promise.all(cinemas.map(lookupCinema));
    drawResults();setStatus(dataMessage);
    requestLocation(false);
  }catch(error){console.error(error);setStatus('지도 초기화 오류: F12 콘솔을 확인해 주세요.');}
}
function sdkReady(){if(!window.kakao||!kakao.maps){setStatus('SDK를 불러오지 못했어요.');return;}kakao.maps.load(initializeMap);}
document.querySelectorAll('.tab').forEach(button=>button.addEventListener('click',()=>{selectedType=button.dataset.type;if(map)drawResults();}));
document.getElementById('allBtn').addEventListener('click',()=>{selectedType='ALL';if(map)drawResults();});
document.getElementById('searchForm').addEventListener('submit',event=>{event.preventDefault();keyword=document.getElementById('keyword').value.trim().toLowerCase();if(map)drawResults();});
document.getElementById('keyword').addEventListener('input',event=>{keyword=event.target.value.trim().toLowerCase();if(map)drawResults();});
document.getElementById('myLocation').addEventListener('click',()=>{if(map)requestLocation(true);});
// 함수 정의를 마친 후 SDK 로딩: 로딩 순서 오류 방지
const script=document.createElement('script');script.src='https://dapi.kakao.com/v2/maps/sdk.js?appkey='+encodeURIComponent(KAKAO_KEY)+'&libraries=services&autoload=false';script.onload=sdkReady;script.onerror=()=>setStatus('카카오맵 로딩 실패: API 사용 설정과 등록 도메인을 확인하세요.');document.body.appendChild(script);
</script></body></html>
